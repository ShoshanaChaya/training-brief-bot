name: Daily workout briefing

on:
  schedule:
    # Fire multiple times each morning. GitHub Actions cron is chronically
    # delayed (1-2hr is common). Python-side dedupe (.last_sent_zurich_date)
    # ensures only the first to fire each Zurich-day actually sends.
    # In summer (CEST, UTC+2): 4 UTC = 6 Zurich. In winter (CET, UTC+1): 5 UTC = 6 Zurich.
    # Extra slots cover for delays.
    - cron: "0 4 * * *"   # summer 6am Zurich, winter 5am
    - cron: "0 5 * * *"   # summer 7am Zurich, winter 6am
    - cron: "0 6 * * *"   # delay backup for both seasons
    - cron: "0 7 * * *"   # last-resort delay backup
  workflow_dispatch:  # manual triggers always send (don't update dedupe state)

permissions:
  contents: write   # so the workflow can commit .last_sent_zurich_date back

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # main.py uses this to decide whether to dedupe (schedule) or always send (manual).
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -m src.main

      - name: Commit dedupe state
        # Only on scheduled runs that actually sent (the file will have been
        # updated). Manual dispatch runs intentionally don't update state.
        if: success() && github.event_name == 'schedule'
        run: |
          if [ ! -f .last_sent_zurich_date ]; then
            echo "No state file written — likely deduped, nothing to commit."
            exit 0
          fi
          if git diff --quiet HEAD -- .last_sent_zurich_date 2>/dev/null && \
             ! git ls-files --others --exclude-standard | grep -q "^.last_sent_zurich_date$"; then
            echo "State file unchanged — nothing to commit."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .last_sent_zurich_date
          git commit -m "bot: mark sent for $(cat .last_sent_zurich_date | tr -d '\n')"
          git push
